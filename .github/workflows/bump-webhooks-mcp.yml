---
name: bump-webhooks-mcp

# Opens a PR that pins the newest webhooks-mcp image digest; merging deploys nothing.
on:
  workflow_dispatch:
    inputs:
      digest:
        description: Pin this digest instead of the newest (sha256:...)
        required: false
        default: ""
  schedule:
    - cron: "23 15 * * *"   # daily

permissions:
  contents: read

concurrency:
  group: bump-webhooks-mcp
  cancel-in-progress: false

jobs:
  # No environment gate, so the schedule runs unattended; only the workflow token is used.
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # git uses GH_TOKEN in the URL, only in the PR step
      - name: Pin the newest image digest
        id: bump
        env:
          DIGEST: ${{ inputs.digest }}
        run: python3 scripts/bump_image_pin.py --var webhooks_mcp_image --image ghcr.io/davcs86/webhooks-mcp ${DIGEST:+--digest "$DIGEST"}
      - name: Already pinned
        if: steps.bump.outputs.changed == 'false'
        run: echo "webhooks-mcp pin is up to date." >> "$GITHUB_STEP_SUMMARY"
      - name: Open the pull request and start CI on its branch
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT: ${{ steps.bump.outputs.short }}
          NEW_DIGEST: ${{ steps.bump.outputs.digest }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
          REVISION: ${{ steps.bump.outputs.revision }}
        run: |
          branch="bump/webhooks-mcp-${SHORT}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rc=0; git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null || rc=$?
          [ "$rc" = 0 ] || [ "$rc" = 2 ] || { echo "::error::git ls-remote failed with exit code ${rc}"; exit 1; }
          if [ "$rc" = 0 ]; then
            prs="$(gh pr list --head "$branch" --state all --json state,number,url)"
            live="$(jq -r '[.[] | select(.state == "OPEN" or .state == "MERGED")][0].url // empty' <<<"$prs")"
            closed="$(jq -r '[.[] | select(.state == "CLOSED")][0].url // empty' <<<"$prs")"
            if [ -n "$live" ]; then
              echo "A bump for ${NEW_DIGEST} already has an open or merged PR: ${live}"
              echo "A bump for \`${NEW_DIGEST}\` already has an open or merged PR: ${live}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            elif [ -n "$closed" ]; then
              echo "::warning::${NEW_DIGEST} was rejected (PR closed without merging: ${closed})."
              echo "It is not proposed again while branch ${branch} exists."
              echo "\`${NEW_DIGEST}\` was rejected (PR closed without merging: ${closed})." >> "$GITHUB_STEP_SUMMARY"
              echo "Not proposed again while branch \`${branch}\` exists." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Branch ${branch} exists without a PR; opening one."
          else
            git checkout -b "$branch"
            git add inventories/prod/group_vars/all/versions.yml docs/versions.md
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Bump webhooks-mcp to sha256:${SHORT}…"
            git push "$remote" "HEAD:refs/heads/${branch}"
          fi
          if [ "$REVISION" = unknown ]; then
            source="Source commit: unknown (this image has no org.opencontainers.image.revision label)."
          else
            source="Source commit, as labelled by the image (not verified): https://github.com/davcs86/webhooks-mcp/commit/${REVISION}"
          fi
          {
            echo "Previous: \`${PREVIOUS}\`"
            echo "New: \`${NEW_DIGEST}\`"
            echo
            echo "$source"
            echo
            echo "Merging this deploys nothing: run deploy (tailnet) afterwards."
            echo "CI for this PR was started by the bump-webhooks-mcp workflow (PRs opened with the workflow token do not trigger it)."
          } > "$RUNNER_TEMP/bump-body.md"
          url="$(gh pr create --base main --head "$branch" --title "Bump webhooks-mcp to sha256:${SHORT}…" --body-file "$RUNNER_TEMP/bump-body.md")"
          gh workflow run ci.yml --ref "$branch"
          echo "Opened ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
