---
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # the bump workflow starts CI on its branch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: ansible-galaxy collection install -r requirements.yml -p collections
      - name: yamllint
        run: yamllint -s .
      - name: ansible-lint
        run: ansible-lint
      - name: Syntax check every playbook
        run: for p in playbooks/*.yml; do ansible-playbook --syntax-check "$p"; done
      - name: shellcheck
        run: shellcheck scripts/*.sh templates/app-deploy/*.sh
      - name: App-deploy template (pins, secret handling, source and report steps)
        run: python3 scripts/app-deploy-template-test.py
      - name: Workflows that commit to main (PUSH_TOKEN PAT only when needed, key confined to production)
        run: python3 scripts/workflow-push-test.py
      - name: Image-pin bump script and its workflow (offline, fake registry, git and gh)
        run: python3 scripts/bump-image-pin-test.py
      - name: Every secret key the roles read exists in secrets/edge.sops.yaml
        run: python3 scripts/secrets-keys-test.py
      - name: Gatus config renders with the expected probes (prod and staging)
        run: python3 scripts/gatus-config-test.py
      - name: Portal zones (*.public, *.private) - names, first tenants, tailnet DNS route
        run: python3 scripts/portal-zones-test.py
      - name: Commsgun config, env files (read back by docker compose), assertions and compose services
        env:
          COMMSGUN_TEST_REQUIRE_DOCKER: "1"
        run: python3 scripts/commsgun-config-test.py
      - name: Happybabytracker env files (read back by docker compose), assertions and compose services
        env:
          HAPPYBABYTRACKER_TEST_REQUIRE_DOCKER: "1"
        run: python3 scripts/happybabytracker-config-test.py
      - name: Authelia configuration renders to the SSO spec (portal, limits, LDAP, the nine OIDC clients)
        run: python3 scripts/authelia-config-test.py
      - name: Backup scripts and units; the happybabytracker snapshot under writes, as root in a Docker-like tree
        env:
          EDGE_BACKUP_TEST_REQUIRE_ROOT: "1"
        run: |
          command -v sqlite3 >/dev/null || sudo apt-get install -y --no-install-recommends sqlite3
          sudo -n env "PATH=$PATH" EDGE_BACKUP_TEST_REQUIRE_ROOT="$EDGE_BACKUP_TEST_REQUIRE_ROOT" python3 scripts/edge-backup-test.py
      - name: No plaintext secrets in secrets/
        run: |
          for f in secrets/*.sops.yaml; do
            [ -e "$f" ] || continue
            grep -q '^sops:' "$f" || { echo "::error file=$f::not SOPS-encrypted"; exit 1; }
          done

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Headscale policy parses, and its tests block passes against fake tagged nodes
        run: scripts/policy-test.sh

  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r tools/pve-setup.requirements.txt
      - run: sudo apt-get install -y --no-install-recommends age
      - name: Proxmox toolkit (dry-run tests, no host needed)
        env:
          PVE_SETUP_REQUIRE_AGE: "1"
        run: python -m unittest tools/test_pve_setup.py
      - name: App deploy gate script against a fake docker
        run: scripts/app-deploy-test.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup
      - name: init-secrets fill-missing (pinned sops, throwaway ssh key)
        env:
          INIT_SECRETS_TEST_REQUIRE_SOPS: "1"
        run: python3 scripts/init-secrets-test.py

  caddy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: ansible-galaxy collection install -r requirements.yml -p collections
      - name: Build Caddy with pinned plugins
        run: |
          v=inventories/prod/group_vars/all/versions.yml
          docker build \
            --build-arg CADDY_BUILDER_IMAGE="$(grep '^caddy_builder_image:' $v | cut -d'"' -f2)" \
            --build-arg CADDY_RUNTIME_IMAGE="$(grep '^caddy_runtime_image:' $v | cut -d'"' -f2)" \
            --build-arg CADDY_VERSION="$(grep '^caddy_version:' $v | cut -d'"' -f2)" \
            --build-arg CADDY_GO_TOOLCHAIN="$(grep '^caddy_go_toolchain:' $v | awk '{print $2}')" \
            --build-arg CADDY_DNS_DESEC_VERSION="$(grep '^caddy_dns_desec_version:' $v | awk '{print $2}')" \
            --build-arg CADDY_RATELIMIT_COMMIT="$(grep '^caddy_ratelimit_commit:' $v | awk '{print $2}')" \
            -t edge-caddy:ci roles/stack/files/caddy
      - name: Validate rendered Caddyfile
        run: |
          ansible localhost -c local -m template -a "src=roles/stack/templates/Caddyfile.j2 dest=$RUNNER_TEMP/Caddyfile"
          docker run --rm -e DESEC_TOKEN=validate -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" edge-caddy:ci \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Routing, rate limits, body caps, tailnet split (offline, mock upstreams)
        run: scripts/caddy-routing-test.sh edge-caddy:ci

  sso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Pinned Authelia validates the rendered config and the generated client hashes
        env:
          SSO_STACK_TEST_REQUIRE_DOCKER: "1"
        run: python3 scripts/sso-stack-test.py

  # The only check the `main` ruleset should require; skipped upstream jobs count as passing.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint, policy, tools, secrets, caddy, sso]
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate upstream results
        run: |
          echo "lint:    ${{ needs.lint.result }}"
          echo "policy:  ${{ needs.policy.result }}"
          echo "tools:   ${{ needs.tools.result }}"
          echo "secrets: ${{ needs.secrets.result }}"
          echo "caddy:   ${{ needs.caddy.result }}"
          echo "sso:     ${{ needs.sso.result }}"
      - name: Fail on upstream failure or cancellation
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more CI jobs failed or were cancelled"
          exit 1
