---
name: init-secrets

# Generates secrets/edge.sops.yaml on the runner and commits only the encrypted file.
# Operator-chosen values come from `production` environment secrets; nothing is echoed.
on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: Replace an existing secrets/edge.sops.yaml (rotates every generated credential)
        type: boolean
        default: false
      fill_missing:
        description: Add only the generated credentials the existing file lacks (for example a new Gatus heartbeat token); nothing already there changes
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # the push below uses the App token, not GITHUB_TOKEN
      - uses: ./.github/actions/setup
      - name: Refuse conflicting inputs
        if: ${{ inputs.overwrite && inputs.fill_missing }}
        run: echo "::error::overwrite and fill_missing are mutually exclusive"; exit 1
      - name: Refuse to clobber unless asked
        if: ${{ !inputs.overwrite && !inputs.fill_missing }}
        run: test ! -e secrets/edge.sops.yaml || { echo "::error::secrets/edge.sops.yaml exists; re-run with overwrite"; exit 1; }
      - name: Decryption key (file only, never echoed)
        if: ${{ inputs.fill_missing }}
        env:
          SOPS_KEY: ${{ secrets.SOPS_AGE_SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SOPS_KEY" > "$RUNNER_TEMP/sops_key" && chmod 600 "$RUNNER_TEMP/sops_key"
          echo "SOPS_AGE_SSH_PRIVATE_KEY_FILE=$RUNNER_TEMP/sops_key" >> "$GITHUB_ENV"
      - name: Add the missing generated credentials
        if: ${{ inputs.fill_missing }}
        run: |
          test -e secrets/edge.sops.yaml || { echo "::error::secrets/edge.sops.yaml does not exist; run without fill_missing"; exit 1; }
          python3 scripts/init_secrets.py --fill-missing secrets/edge.sops.yaml
          grep -q '^sops:' secrets/edge.sops.yaml
      - name: Generate and encrypt
        if: ${{ !inputs.fill_missing }}
        env:
          DESEC_TOKEN: ${{ secrets.DESEC_TOKEN }}
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          ADMIN_CONSOLE_PASSWORD: ${{ secrets.ADMIN_CONSOLE_PASSWORD }}
          NTFY_DAVID_PASSWORD: ${{ secrets.NTFY_DAVID_PASSWORD }}
        run: |
          host="edge.ts.$(awk '/^domain:/{print $2}' inventories/prod/group_vars/all/main.yml)"
          python3 scripts/init_secrets.py "$host" secrets/edge.sops.yaml
          grep -q '^sops:' secrets/edge.sops.yaml
      - name: Commit encrypted file
        id: stage
        env:
          FILL_MISSING: ${{ inputs.fill_missing }}
        run: |
          git add secrets/edge.sops.yaml
          if git diff --cached --quiet; then echo "nothing to commit"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          msg="chore(secrets): generate edge.sops.yaml"
          [ "$FILL_MISSING" = "true" ] && msg="chore(secrets): add missing generated credentials to edge.sops.yaml"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "$msg [run ${{ github.run_id }}]"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push token is not configured
        if: steps.stage.outputs.changed == 'true' && vars.PUSH_APP_CLIENT_ID == ''
        run: |
          echo "::error::main only accepts PRs: set PUSH_APP_CLIENT_ID and PUSH_APP_PRIVATE_KEY (docs/runbooks/github-push-app.md)"
          exit 1
      - name: Push token (GitHub App on the ruleset's bypass list)
        id: push-token
        if: steps.stage.outputs.changed == 'true' && vars.PUSH_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.PUSH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push to ${{ github.ref_name }}
        if: steps.stage.outputs.changed == 'true' && steps.push-token.outcome == 'success'
        env:
          PUSH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
