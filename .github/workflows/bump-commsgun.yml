---
name: bump-commsgun

# Opens one PR that pins the newest commsgun api and ui image digests together; merging deploys nothing.
on:
  workflow_dispatch:
    inputs:
      api_digest:
        description: Pin this api digest instead of the newest (sha256:...)
        required: false
        default: ""
      ui_digest:
        description: Pin this ui digest instead of the newest (sha256:...)
        required: false
        default: ""
  schedule:
    - cron: "41 15 * * *"   # daily

permissions:
  contents: read

concurrency:
  group: bump-commsgun
  cancel-in-progress: true

jobs:
  # No environment gate, so the schedule runs unattended; only the workflow token is used.
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # git uses GH_TOKEN in the URL, only in the PR step
      - name: Pin the newest api digest
        id: api
        env:
          DIGEST: ${{ inputs.api_digest }}
        run: python3 scripts/bump_image_pin.py --var commsgun_api_image --image ghcr.io/davcs86/commsgun-api ${DIGEST:+--digest "$DIGEST"}
      - name: Pin the newest ui digest
        id: ui
        env:
          DIGEST: ${{ inputs.ui_digest }}
        run: python3 scripts/bump_image_pin.py --var commsgun_ui_image --image ghcr.io/davcs86/commsgun-ui ${DIGEST:+--digest "$DIGEST"}
      - name: Already pinned
        if: steps.api.outputs.changed == 'false' && steps.ui.outputs.changed == 'false'
        run: echo "commsgun pins are up to date." >> "$GITHUB_STEP_SUMMARY"
      # An unchanged image prints no revision, so its pinned commit is read from docs/versions.md.
      - name: Refuse a pair from different commits
        id: guard
        if: steps.api.outputs.changed == 'true' || steps.ui.outputs.changed == 'true'
        env:
          API_REV: ${{ steps.api.outputs.revision }}
          UI_REV: ${{ steps.ui.outputs.revision }}
        run: |
          pinned_commit() {
            grep -F "\`$1\`" docs/versions.md | sed -nE 's/.*commit `([0-9a-f]{7}|unknown)`.*/\1/p'
          }
          pinned_digest() {
            sed -nE "s/^$1: \".*@(sha256:[0-9a-f]{64})\"\$/\\1/p" inventories/prod/group_vars/all/versions.yml
          }
          API_REV="${API_REV:-$(pinned_commit commsgun_api_image)}"
          UI_REV="${UI_REV:-$(pinned_commit commsgun_ui_image)}"
          if [ -z "$API_REV" ] || [ -z "$UI_REV" ] || [ "$API_REV" = unknown ] || [ "$UI_REV" = unknown ] || [ "${API_REV:0:7}" != "${UI_REV:0:7}" ]; then
            echo "::warning::commsgun images are from different commits or unlabelled (api ${API_REV:-?}, ui ${UI_REV:-?}); nothing proposed."
            echo "commsgun images are from different commits or unlabelled (api \`${API_REV:-?}\`, ui \`${UI_REV:-?}\`); nothing proposed." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          full="$API_REV"; [ "${#full}" = 40 ] || full="$UI_REV"
          {
            echo "proceed=true"
            echo "api_digest=$(pinned_digest commsgun_api_image)"
            echo "ui_digest=$(pinned_digest commsgun_ui_image)"
            echo "revision=${full}"
          } >> "$GITHUB_OUTPUT"
      - name: Open the pull request and start CI on its branch
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_DIGEST: ${{ steps.guard.outputs.api_digest }}
          UI_DIGEST: ${{ steps.guard.outputs.ui_digest }}
          API_PREV: ${{ steps.api.outputs.previous }}
          UI_PREV: ${{ steps.ui.outputs.previous }}
          REVISION: ${{ steps.guard.outputs.revision }}
        run: |
          branch="bump/commsgun"
          title="Bump commsgun to api sha256:${API_DIGEST:7:12}… / ui sha256:${UI_DIGEST:7:12}…"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # --head matches fork branches of the same name too; only this repository's PRs count.
          prs="$(gh pr list --head "$branch" --state all --limit 200 --json state,number,url,title,headRefOid,isCrossRepository)"
          prs="$(jq '[.[] | select(.isCrossRepository == false)]' <<<"$prs")"
          open_number="$(jq -r '[.[] | select(.state == "OPEN")][0].number // empty' <<<"$prs")"
          open_url="$(jq -r '[.[] | select(.state == "OPEN")][0].url // empty' <<<"$prs")"
          open_title="$(jq -r '[.[] | select(.state == "OPEN")][0].title // empty' <<<"$prs")"
          open_head="$(jq -r '[.[] | select(.state == "OPEN")][0].headRefOid // empty' <<<"$prs")"
          rejected="$(jq -r --arg t "$title" '[.[] | select(.state == "CLOSED" and .title == $t)][0].url // empty' <<<"$prs")"
          if [ -n "$open_number" ] && [ "$open_title" = "$title" ]; then
            echo "these digests are already proposed: ${open_url}"
            echo "these digests are already proposed: ${open_url}" >> "$GITHUB_STEP_SUMMARY"
            runs="$(gh run list --workflow ci.yml --branch "$branch" --limit 20 --json headSha)"
            ran="$(jq -r --arg h "$open_head" '[.[] | select(.headSha == $h)] | length' <<<"$runs")"
            if [ "$ran" = 0 ]; then
              echo "No ci run for its head ${open_head}; starting one."
              gh workflow run ci.yml --ref "$branch"
            fi
            exit 0
          fi
          if [ -n "$rejected" ]; then
            echo "::warning::this bump was rejected (PR closed without merging: ${rejected}); not proposed again."
            echo "this bump was rejected (PR closed without merging: ${rejected}); not proposed again." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout -B "$branch"
          git add inventories/prod/group_vars/all/versions.yml docs/versions.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "$title"
          # One branch, rebuilt from main each time: the force push is what lets the open PR be reused.
          git push --force "$remote" "HEAD:refs/heads/${branch}"
          if [ "$REVISION" = unknown ]; then
            source="Source commit: unknown (this image has no org.opencontainers.image.revision label)."
          else
            source="Source commit, as labelled by the image (not verified): https://github.com/davcs86/commsgun/commit/${REVISION}"
          fi
          {
            echo "API previous: \`${API_PREV:-$API_DIGEST}\`"
            echo "API new: \`${API_DIGEST}\`$([ -n "$API_PREV" ] || echo ' (unchanged)')"
            echo "UI previous: \`${UI_PREV:-$UI_DIGEST}\`"
            echo "UI new: \`${UI_DIGEST}\`$([ -n "$UI_PREV" ] || echo ' (unchanged)')"
            echo
            echo "$source"
            echo
            echo "Merging this deploys nothing: run deploy (tailnet) afterwards."
            echo "CI for this PR was started by the bump-commsgun workflow (PRs opened with the workflow token do not trigger it)."
            echo "This branch is rebuilt by that workflow when newer images are published; commits added to it by hand are lost."
          } > "$RUNNER_TEMP/bump-body.md"
          if [ -n "$open_number" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${open_number}" -f title="$title" -F body=@"$RUNNER_TEMP/bump-body.md" >/dev/null
            url="$open_url"
            verb="Updated"
          else
            url="$(gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/bump-body.md")"
            verb="Opened"
          fi
          gh workflow run ci.yml --ref "$branch"
          echo "${verb} ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
