---
name: node-admin
run-name: "node-admin: ${{ inputs.action }} ${{ inputs.device }}"

# Manage tailnet devices from GitHub (works from the mobile app). The result and a device table appear
# on the run's Summary page.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [list-devices, approve-device, set-tags, force-reauth, remove-device, mint-ci-key, diagnose-boot]
        default: list-devices
      registration:
        description: "approve-device: paste the login URL (or the hskey-authreq-… ID) shown on the new device"
        required: false
      user:
        description: "approve-device: who owns it (david = phone/laptop, edge only; david_admin = full access)"
        type: choice
        options: [david, david_admin]
        default: david
      device:
        description: "set-tags / force-reauth / remove-device: device name or ID (see list-devices)"
        required: false
      tags:
        description: "set-tags, or optional on approve-device for servers: e.g. app or db,backup (tag: prefix optional)"
        required: false

permissions:
  contents: write   # mint-ci-key commits secrets/ci-authkey.sops.yaml

concurrency:
  group: deploy-edge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup
        with:
          tailscale: "true"
      - name: Credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SOPS_KEY: ${{ secrets.SOPS_AGE_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SOPS_KEY" > "$RUNNER_TEMP/sops_key" && chmod 600 "$RUNNER_TEMP/sops_key"
          echo "SOPS_AGE_SSH_PRIVATE_KEY_FILE=$RUNNER_TEMP/sops_key" >> "$GITHUB_ENV"
      - id: ts
        run: scripts/runner-tailnet.sh up
      - name: Run
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_REGISTRATION: ${{ inputs.registration }}
          IN_USER: ${{ inputs.user }}
          IN_DEVICE: ${{ inputs.device }}
          IN_TAGS: ${{ inputs.tags }}
        run: |
          if [ "$IN_ACTION" = diagnose-boot ]; then
            exec ansible-playbook playbooks/diag-boot.yml \
              -e edge_tailnet_address=${{ steps.ts.outputs.edge_ip }} -e "summary_file=$RUNNER_TEMP/summary.md"
          fi
          jq -n --arg action "$IN_ACTION" --arg registration "$IN_REGISTRATION" --arg user "$IN_USER" \
                --arg device "$IN_DEVICE" --arg tags "$IN_TAGS" --arg edge "${{ steps.ts.outputs.edge_ip }}" \
                --arg summary "$RUNNER_TEMP/summary.md" \
                '{action:$action, registration:$registration, user:$user, device:$device, tags:$tags,
                  edge_tailnet_address:$edge, summary_file:$summary}' > "$RUNNER_TEMP/vars.json"
          ansible-playbook playbooks/node-admin.yml -e "@$RUNNER_TEMP/vars.json"
      - name: Summary
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else echo "### ${{ inputs.action }} failed - open the **Run** step for the reason" >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        run: scripts/runner-tailnet.sh down
      - name: Commit CI key
        if: inputs.action == 'mint-ci-key'
        run: |
          git add secrets/ci-authkey.sops.yaml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(tailnet): rotate tag:ci key [run ${{ github.run_id }}]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
