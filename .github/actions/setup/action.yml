---
name: controller-setup
description: Python + pinned Ansible + collections + checksum-verified sops (and optionally tailscale) on the runner.
inputs:
  tailscale:
    description: Also install the pinned tailscale client
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.13"
    - shell: bash
      run: pip install -r requirements.txt && ansible-galaxy collection install -r requirements.yml -p collections
    - name: sops (pinned, checksum-verified)
      shell: bash
      run: |
        v="$(awk '/^sops_version:/{print $2}' "$GITHUB_WORKSPACE/inventories/prod/group_vars/all/versions.yml")"
        cd "$RUNNER_TEMP"
        curl -fsSLO "https://github.com/getsops/sops/releases/download/${v}/sops-${v}.linux.amd64"
        sum="$(awk '/^sops_linux_amd64_sha256:/{print $2}' "$GITHUB_WORKSPACE/inventories/prod/group_vars/all/versions.yml")"
        echo "${sum}  sops-${v}.linux.amd64" | sha256sum -c -
        sudo install -m 0755 "sops-${v}.linux.amd64" /usr/local/bin/sops
    - name: tailscale (pinned, checksum-verified)
      if: inputs.tailscale == 'true'
      shell: bash
      run: |
        v="$(awk -F'"' '/^tailscale_package_version:/{print $2}' "$GITHUB_WORKSPACE/inventories/prod/group_vars/all/versions.yml")"
        cd "$RUNNER_TEMP"
        curl -fsSLO "https://pkgs.tailscale.com/stable/tailscale_${v}_amd64.tgz"
        sum="$(awk '/^tailscale_tgz_amd64_sha256:/{print $2}' "$GITHUB_WORKSPACE/inventories/prod/group_vars/all/versions.yml")"
        echo "${sum}  tailscale_${v}_amd64.tgz" | sha256sum -c -
        tar xzf "tailscale_${v}_amd64.tgz"
        sudo install -m 0755 "tailscale_${v}_amd64/tailscale" "tailscale_${v}_amd64/tailscaled" /usr/local/bin/
