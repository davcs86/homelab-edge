---
# Contract with app-deploy.sh: image comes from ${APP_IMAGE} (a digest), everything else from .env. Define healthchecks.
services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
