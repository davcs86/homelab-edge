---
# Copy to .github/workflows/deploy.yml in the app repo and resolve every EDIT line. Guide: docs/runbooks/deploy-compose-app.md.
name: deploy

on:
  push:
    branches: [main]            # EDIT: pushes deploy to staging
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (production needs the environment's reviewers)
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

env:
  APP_NAME: myapp                   # EDIT: compose project and /opt/<name> on the VM
  # Keep in step with tailscale_package_version / tailscale_tgz_amd64_sha256 in homelab-edge's versions.yml.
  TAILSCALE_VERSION: "1.98.10"
  TAILSCALE_SHA256: 52490ce0832b245857e2afef7426d6ae5a4b49fb391412833cc95729bd23f7de

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build and push; the deploy uses the digest, never a tag
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$repo:$GITHUB_SHA" .
          docker push "$repo:$GITHUB_SHA"
          echo "image=$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:$GITHUB_SHA")" >>"$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment || 'staging' }}
    concurrency:
      group: deploy-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      LOGIN_SERVER: ${{ vars.TAILNET_LOGIN_SERVER }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Tailnet key must not be about to expire
        env:
          EXPIRES: ${{ vars.TS_AUTHKEY_EXPIRES }}
        run: |
          left=$(( ($(date -d "$EXPIRES" +%s) - $(date +%s)) / 86400 ))
          [ "$left" -ge 0 ] || { echo "::error::TS_AUTHKEY expired; mint a new tag:ci key (see the runbook)"; exit 1; }
          [ "$left" -ge 14 ] || echo "::warning::TS_AUTHKEY expires in $left days"

      - name: Tailscale (pinned, checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE_VERSION}_amd64.tgz"
          echo "${TAILSCALE_SHA256}  tailscale_${TAILSCALE_VERSION}_amd64.tgz" | sha256sum -c -
          tar xzf "tailscale_${TAILSCALE_VERSION}_amd64.tgz"
          sudo install -m 0755 "tailscale_${TAILSCALE_VERSION}_amd64/tailscale" "tailscale_${TAILSCALE_VERSION}_amd64/tailscaled" /usr/local/bin/

      - name: Join the tailnet as an ephemeral tag:ci node
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          sudo mkdir -p /run/tailscale
          sudo tailscaled --state=mem: --socket=/run/tailscale/tailscaled.sock >"$RUNNER_TEMP/tailscaled.log" 2>&1 &
          for _ in $(seq 1 20); do sudo tailscale status >/dev/null 2>&1 && break; sleep 1; done
          sudo tailscale up --login-server "$LOGIN_SERVER" --auth-key "$TS_AUTHKEY" \
            --hostname "gha-${APP_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --accept-dns=false --timeout 60s

      - name: SSH credentials (files only, host key pinned)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          echo "VM_IP=$(sudo tailscale ip -4 "$DEPLOY_HOST")" >>"$GITHUB_ENV"

      - name: Ship the release and deploy it; the VM rolls back if it is not healthy
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          rel="${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          gate() { ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias="$DEPLOY_HOST" "deploy@$VM_IP" "$@"; }
          gate put "$rel" compose.yml <compose.yml
          { printf 'APP_IMAGE=%s\n' "$IMAGE"; printf '%s\n' "$APP_ENV"; } | gate put "$rel" .env
          printf '%s\n' "$GHCR_TOKEN" | gate deploy "$rel" "$GITHUB_ACTOR"
          { echo "### Deployed ${{ inputs.environment || 'staging' }}"; echo; echo "- release \`$rel\`"; echo "- image \`$IMAGE\`"; } >>"$GITHUB_STEP_SUMMARY"
          gate status

      - name: Leave the tailnet
        if: always()
        run: |
          sudo tailscale logout 2>/dev/null || true
          sudo pkill tailscaled 2>/dev/null || true
