---
# Runs the nightly job on demand (backup, push, restore drill) and prints its journal, also when it fails.
- name: Backup and restore drill now
  hosts: edge
  become: true
  gather_facts: false
  tasks:
    - name: Run edge-backup.service (blocks until the oneshot finishes)  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl start edge-backup.service
      changed_when: true
      failed_when: false
    - name: Journal of this run
      ansible.builtin.command: journalctl -u edge-backup.service --since "-15min" --no-pager -o cat
      register: _journal
      changed_when: false
    - name: Show
      ansible.builtin.debug:
        var: _journal.stdout_lines
    - name: Fail if the run failed  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl show -p Result --value edge-backup.service
      register: _result
      changed_when: false
      failed_when: _result.stdout != 'success'
