---
# Database host (tag:db): PostgreSQL + TimescaleDB, PgBouncer, pgBackRest. docs/runbooks/db-host.md.
#   bootstrap  once, by the operator, as root over the LAN: -e db_stage=bootstrap -e ansible_user=root -e ansible_host=<LAN IP>
#   full       from CI over the tailnet (the db-host workflow)
- name: Configure the database host
  hosts: database
  become: "{{ ansible_user | default('root') != 'root' }}"
  gather_facts: false
  vars:
    db_stage: full
  pre_tasks:
    - name: Load secrets
      community.sops.load_vars:
        file: ../secrets/edge.sops.yaml
        name: edge_secrets
      delegate_to: localhost
      become: false
      no_log: true

    - name: Python for Ansible (a fresh template may not ship it)
      ansible.builtin.raw: >-
        python3 -c 'import apt' 2>/dev/null || (apt-get update && apt-get install -y python3 python3-apt)
      register: _python
      changed_when: "'Setting up python3' in _python.stdout"

    - name: Gather facts
      ansible.builtin.setup:

    - name: Require a Debian 13 container
      ansible.builtin.assert:
        that: ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version == '13'
        fail_msg: the package pins are for Debian 13 (trixie)
  roles:
    - db_host
