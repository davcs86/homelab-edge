---
# Inputs are validated by "Check the inputs"; usage: docs/runbooks/tailnet-devices.md.
- name: Tailnet node administration
  hosts: edge
  become: true
  gather_facts: false
  vars:
    _hs: docker compose -f {{ edge_root }}/compose.yml exec -T headscale headscale
    _actions: [list-devices, approve-device, set-tags, force-reauth, remove-device, mint-ci-key]
    _needs_device: [set-tags, force-reauth, remove-device]
    # Accepts the whole registration URL shown on the device, or just the ID.
    _auth_id: "{{ registration | default('') | regex_search('hskey-authreq-[A-Za-z0-9_-]{24}') or '' }}"
    _tags: >-
      {{ (tags | default('')).replace(' ', '').split(',') | select | map('regex_replace', '^(tag:)?', 'tag:') | list }}
  tasks:
    - name: Check the inputs
      ansible.builtin.assert:
        that: item.ok
        fail_msg: "{{ item.msg }}"
        quiet: true
      loop:
        - ok: "{{ action | default('') in _actions }}"
          msg: "action must be one of: {{ _actions | join(', ') }}"
        - ok: "{{ action != 'approve-device' or _auth_id | length > 0 }}"
          msg: >-
            approve-device needs 'registration': paste the URL (or the hskey-authreq-... ID) the device shows
            after `tailscale up --login-server https://{{ headscale_hostname }}`.
        - ok: "{{ action != 'approve-device' or user | default('') in headscale_users }}"
          msg: "approve-device needs 'user': one of {{ headscale_users | join(', ') }}"
        - ok: "{{ action not in _needs_device or device | default('') | length > 0 }}"
          msg: "{{ action }} needs 'device': a name or ID from list-devices"
        - ok: "{{ action != 'set-tags' or _tags | length > 0 }}"
          msg: "set-tags needs 'tags', e.g. xstockstrat or xstockstrat,db"
        - ok: "{{ _tags | reject('match', '^tag:[a-z0-9-]+$') | list | length == 0 }}"
          msg: "tags may use only lowercase letters, digits and '-': got {{ _tags | join(', ') }}"
      loop_control:
        label: "{{ item.msg | truncate(60) }}"

    - name: Devices before
      ansible.builtin.command: "{{ _hs }} nodes list -o json"
      register: _before
      changed_when: false

    - name: Find the device
      when: action in _needs_device
      block:
        - name: Match by name or ID
          ansible.builtin.set_fact:
            _target: >-
              {{ _before.stdout | from_json | selectattr('given_name', 'equalto', device)
                 | list + _before.stdout | from_json | selectattr('id', 'equalto', device | int) | list }}

        - name: Device exists
          ansible.builtin.assert:
            that: _target | length > 0
            fail_msg: >-
              No device '{{ device }}'. Known devices:
              {{ _before.stdout | from_json | map(attribute='given_name') | join(', ') or 'none' }}
            quiet: true

    - name: Approve a waiting device for a user
      ansible.builtin.command: "{{ _hs }} auth register --user {{ user }} --auth-id {{ _auth_id }} -o json"
      register: _approved
      when: action == 'approve-device'
      changed_when: true

    - name: Set tags
      ansible.builtin.command: >-
        {{ _hs }} nodes tag -i {{ (_approved.stdout | from_json).id if action == 'approve-device' else _target[0].id }}
        -t {{ _tags | join(',') }}
      when: action == 'set-tags' or (action == 'approve-device' and _tags | length > 0)
      changed_when: true

    - name: Force re-authentication (keeps the device record)
      ansible.builtin.command: "{{ _hs }} nodes expire -i {{ _target[0].id }}"
      when: action == 'force-reauth'
      changed_when: true

    - name: Remove the device (revokes its key immediately)
      ansible.builtin.command: "{{ _hs }} nodes delete -i {{ _target[0].id }} --force"
      when: action == 'remove-device'
      changed_when: true

    - name: Mint a reusable, ephemeral tag:ci key and encrypt it into the repo
      when: action == 'mint-ci-key'
      block:
        - name: Mint
          ansible.builtin.command: >-
            {{ _hs }} preauthkeys create --tags tag:ci --reusable --ephemeral --expiration {{ ci_key_hours | default(24) }}h -o json
          register: _ci_key
          changed_when: true
          no_log: true
        - name: Encrypt
          community.sops.sops_encrypt:
            path: "{{ playbook_dir }}/../secrets/ci-authkey.sops.yaml"
            content_yaml:
              tailscale_ci_authkey: "{{ (_ci_key.stdout | from_json).key }}"
              expires_at: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime((_ci_key.stdout | from_json).expiration.seconds) }}"
            force: true
          delegate_to: localhost
          become: false
          no_log: true

    - name: Devices after
      ansible.builtin.command: "{{ _hs }} nodes list -o json"
      register: _after
      changed_when: false

    - name: Build the summary
      ansible.builtin.set_fact:
        _summary: |
          ### {{ _result }}

          | Device | Owner | IPv4 | Online | Last seen (UTC) | Key expires |
          |---|---|---|---|---|---|
          {% for n in _after.stdout | from_json | sort(attribute='given_name') %}
          {%- set owner = n.tags | default([]) | join(' ') or n.user.name | default('?') %}
          {%- set ipv4 = n.ip_addresses | default([]) | select('search', '^[0-9.]+$') | first | default('') %}
          {%- set seen = '%Y-%m-%d %H:%M' | strftime(n.last_seen.seconds) if n.last_seen is defined else '' %}
          {%- set expires = '%Y-%m-%d' | strftime(n.expiry.seconds) if n.expiry.seconds | default(0) > 0 else 'never' %}
          | {{ n.given_name }} (id {{ n.id }}) | {{ owner }} | {{ ipv4 }} | {{ 'yes' if n.online | default(false) else 'no' }} | {{ seen }} | {{ expires }} |
          {% endfor %}
      vars:
        _name: "{{ (_target | default([{}]))[0].given_name | default(device | default('')) }}"
        _result: >-
          {{ {'list-devices': 'Devices',
              'approve-device': 'Approved ' ~ ((_approved.stdout | default('{}') | from_json).given_name | default('device')) ~ ' for ' ~ (user | default(''))
                                ~ ((' with ' ~ _tags | join(' ')) if _tags | length > 0 else ''),
              'set-tags': 'Tagged ' ~ _name ~ ': ' ~ _tags | join(' '),
              'force-reauth': _name ~ ' must log in again',
              'remove-device': 'Removed ' ~ _name,
              'mint-ci-key': 'New tag:ci key committed to secrets/ci-authkey.sops.yaml (valid ' ~ (ci_key_hours | default(24)) ~ ' h)'}[action] }}

    - name: Show the summary
      ansible.builtin.debug:
        msg: "{{ _summary.splitlines() }}"

    - name: Write the summary for the workflow run page
      ansible.builtin.copy:
        dest: "{{ summary_file }}"
        content: "{{ _summary }}"
        mode: "0644"
      delegate_to: localhost
      become: false
      when: summary_file is defined
