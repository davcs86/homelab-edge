# SSO people: template. Copy it OUTSIDE the repo, fill it in, and never commit the filled copy: emails are personal data,
# and the result goes into SOPS (key decided by the Authelia role PR). Design: docs/superpowers/specs/2026-11-23-authelia-sso-respec.md
#
# Rules (docs/runbooks/sso.md § 2):
#   - username and sub are PERMANENT: every app links to (issuer, sub). Use ^[a-z0-9._-]{3,32}$ for the username.
#   - email is unique across people. No app links by email; it is contact data only.
#   - groups open apps; roles are granted inside each app, and each person links in each app (sso.md § 5).
#   - no passwords anywhere in SOPS: each person sets their own in lldap with "Forgot password" (sso.md § 3).
#
# Groups: xstockstrat | xstockstrat-staging | webhooks-mcp | commsgun | happybabytracker
# The four people and their groups are in the spec § 7; copy them here and add the emails.
---
people:
  - username: ""            # permanent, e.g. "david"
    sub: ""                 # permanent UUID, e.g. from `uuidgen`; applied to Authelia at deploy
    display_name: ""        # free text, editable later
    email: ""               # unique; admins edit it in SOPS only
    groups: []              # e.g. [xstockstrat, xstockstrat-staging, happybabytracker]
    second_factor: passkey  # passkey | totp  (what they plan to enrol; informational)

  # - username: ""
  #   sub: ""
  #   display_name: ""
  #   email: ""
  #   groups: []
  #   second_factor: totp
