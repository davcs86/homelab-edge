---
# ---------- Naming ----------
domain: natanddavehouse.com
headscale_hostname: "hs.{{ domain }}"
public_app_hostname: "xstockstrat.{{ domain }}"
magicdns_base_domain: "ts.{{ domain }}"
acme_zone: "acme.{{ domain }}"          # delegated to deSEC; holds only ACME TXT records
acme_email: davcs86@gmail.com
status_hostname: "status.{{ magicdns_base_domain }}"
ntfy_hostname: "ntfy.{{ magicdns_base_domain }}"

# ---------- DigitalOcean ----------
do_region: sfo3
do_size: s-1vcpu-2gb-amd
do_droplet_name: edge-sfo3-01
do_tag: homelab-edge
do_firewall_name: homelab-edge
do_monitoring: true
do_backups: false                        # deferred (cost); headscale state has its own encrypted backup
do_ipv6: true
# do_reserved_ipv4 is written to generated.yml by the first provision run (committed by the workflow),
# so later rebuilds re-attach the same address and DNS never changes.

# ---------- Host access ----------
admin_user: david_admin
deploy_user: deploy                      # used only by GitHub Actions
# Public halves only; private keys never enter the repo.
admin_ssh_public_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKApHPR1HHqSoai6FXgCUwxfeeDChmSuhagQGqcsILm/ david_admin@homelab"
deploy_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGOuroREm2DF2lSNSCIX5dUsHdhR2Yk3pPWJ79E45zZR gha_deploy@homelab"
# Source CIDRs allowed to reach tcp/22 publicly. Empty after bootstrap; deploys go over the tailnet.
ssh_public_allow_cidrs: []

# ---------- Tailnet ----------
headscale_users: [david, david_admin]
edge_tailnet_hostname: edge
tailnet_v4_prefix: 100.64.0.0/10
tailnet_v6_prefix: fd7a:115c:a1e0::/48
ephemeral_inactivity_timeout: 5m
# Home nodes as they will be named in MagicDNS (<hostname>.<magicdns_base_domain>). Hostname = workload tag name (tag:xstockstrat -> xstockstrat).
app_tailnet_host: "xstockstrat.{{ magicdns_base_domain }}"
staging_tailnet_host: "xstockstrat-staging.{{ magicdns_base_domain }}"
# Edge-facing name of the staging route; must differ from every node's MagicDNS name.
staging_ui_hostname: "xstockstrat-staging-ui.{{ magicdns_base_domain }}"
staging_edge_port: 8443                  # tailnet-only listener; not in the DO firewall
pve_tailnet_host: "pve.{{ magicdns_base_domain }}"
backup_tailnet_host: "backup.{{ magicdns_base_domain }}"

# ---------- xstockstrat upstreams ----------
app_ui_port: 3000
app_agent_port: 9000

# ---------- Rate limits (per client IP) ----------
ratelimit:
  login: {events: 5, window: 1m}
  login_hourly: {events: 30, window: 1h}
  register: {events: 10, window: 1h}
  oauth: {events: 30, window: 1m}
  mcp: {events: 120, window: 1m}
  general: {events: 300, window: 1m}
body_limits:
  mcp: 1MB
  login: 8KB
  register: 16KB
  default: 64KB

# ---------- Monitoring ----------
ntfy_alert_topic: homelab-alerts
gatus_port: 8081
# Gatus raises an alert when a pusher is silent for longer than its interval.
heartbeat_pve_interval: 3m          # Proxmox pushes every 60 s
heartbeat_backup_interval: 26h      # nightly backup + drill pushes on success
heartbeat_db_interval: 11m          # DB host pushes every 5 min

# ---------- Backups ----------
backup_schedule: "*-*-* 03:17:00 UTC"
reboot_schedule: "*-*-* 04:00:00 America/Los_Angeles"   # only when /var/run/reboot-required exists
backup_local_retention_days: 7
backup_remote_user: edge-backup                         # account on the backup host, forced to rrsync
backup_remote_path: headscale                           # relative to that account's rrsync root
# Public recipients; the offline key decrypts, the on-host key exists only for restore verification.
backup_age_recipients:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGeuIlI039KbXrVS1w7FJHHbig7uL8/vqK97pYuFZy8y backup@homelab"   # offline key; private half never on any host
backup_host_known_hosts: ""                             # TODO(provide): `ssh-keyscan backup.<tailnet>` output; empty = trust on first use

# ---------- pgBackRest offsite repo ----------
pgbackrest_tls_port: 8432
pgbackrest_stanza: main
pgbackrest_repo_path: /var/lib/pgbackrest
pgbackrest_client_cn: db-pgbackrest                     # CN on the database host's client cert
pgbackrest_edge_client_cn: edge-pgbackrest              # CN on the edge's client cert (the edge pulls backups)
pgbackrest_retention_full: 2
pgbackrest_retention_diff: 6
# Off until the stanza exists on the edge (docs/runbooks/db-host.md); then flip and deploy.
pgbackrest_backups_enabled: false
# TODO(ask): schedules are not stated by the owner; the build guide asks for a weekly full and a daily differential.
pgbackrest_full_schedule: "Sun *-*-* 02:30:00 UTC"
pgbackrest_diff_schedule: "Mon..Sat *-*-* 02:30:00 UTC"

# ---------- Database host (tag:db) ----------
db_tailnet_hostname: db
db_tailnet_host: "{{ db_tailnet_hostname }}.{{ magicdns_base_domain }}"
db_postgres_major: 18
db_data_dir: "/var/lib/postgresql/{{ db_postgres_major }}/main"
# Off until the stanza exists on the edge; with it on and no stanza, WAL piles up on the data disk.
db_archive_enabled: false
# TODO(ask): match DigitalOcean's datcollate before restoring a dump (SELECT datcollate FROM pg_database).
db_cluster_locale: C.UTF-8
db_workload_locale: C.UTF-8
db_pgbouncer_pool_size: 5               # per database; xstockstrat's bars-fetch ceiling is this pool size
# Tailnet names of devices allowed to log in as `admin` (read-only) and as `superadmin` (hostssl); empty = ssh in, `sudo -u postgres psql`.
db_admin_tailnet_hosts: []
db_superadmin_tailnet_hosts: []
db_admin_connection_limit: 3
db_superadmin_connection_limit: 3
# One database and owner role per workload (never shared across environments); the PgBouncer pool is named after the database.
# connection_limit: 8 direct pools doubled by a rolling deploy, 2 migrator, 1 pool of db_pgbouncer_pool_size (23).
db_workloads:
  - env: production
    database: xstockstrat-production
    role: xstockstrat_production
    password_key: db_role_xstockstrat_production_password
    tailnet_host: "{{ app_tailnet_host.split('.')[0] }}"
    connection_limit: 25
    settings: {}
  - env: staging
    database: xstockstrat-staging
    role: xstockstrat_staging
    password_key: db_role_xstockstrat_staging_password
    tailnet_host: "{{ staging_tailnet_host.split('.')[0] }}"
    connection_limit: 25
    settings: {}

# ---------- Paths ----------
edge_root: /opt/edge
