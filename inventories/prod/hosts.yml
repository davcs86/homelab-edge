---
# edge_connect=public only for bootstrap (firewall rule scoped to the runner's IP); every later run is tailnet.
all:
  children:
    edge:
      hosts:
        edge-sfo3-01:
          ansible_host: >-
            {{ ((edge_connect | default('tailnet')) == 'public')
               | ternary(edge_public_ip | default(do_reserved_ipv4),
                         edge_tailnet_address | default(edge_tailnet_hostname ~ '.' ~ magicdns_base_domain)) }}
          ansible_user: "{{ deploy_user }}"
          # Host key is pinned under a fixed alias, so it verifies identically over the public IP and the tailnet.
          ansible_ssh_common_args: >-
            -o HostKeyAlias=edge-sfo3-01 -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile={{ inventory_dir }}/known_hosts
    database:
      hosts:
        db:
          ansible_host: "{{ db_tailnet_address | default(db_tailnet_host) }}"
          ansible_user: "{{ deploy_user }}"
          # Pinned under the alias `db` in known_hosts, so it verifies on the LAN (bootstrap) and on the tailnet.
          ansible_ssh_common_args: >-
            -o HostKeyAlias=db -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile={{ inventory_dir }}/known_hosts
    apps:
      # Compose app VMs (Debian 13), converged by the app-host workflow; app_tailnet_address is the runner's tailnet lookup.
      hosts:
        xstockstrat-staging:
          gate_sops_key: app_gate_xstockstrat_staging_public_key
          tailnet_host_tag: tag:xstockstrat-staging
        xstockstrat:
          gate_sops_key: app_gate_xstockstrat_production_public_key
          tailnet_host_tag: tag:xstockstrat
      vars:
        ansible_host: "{{ app_tailnet_address | default(inventory_hostname ~ '.' ~ magicdns_base_domain) }}"
        ansible_user: "{{ deploy_user }}"
        ansible_ssh_common_args: >-
          -o HostKeyAlias={{ inventory_hostname }} -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile={{ inventory_dir }}/known_hosts
