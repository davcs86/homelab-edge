---
- name: Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
      Suites: {{ ansible_facts.distribution_release }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc
  register: _docker_repo

- name: Install pinned Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages | dict2items | map(attribute='key') | zip(docker_packages | dict2items | map(attribute='value')) | map('join', '=') | list }}"
    update_cache: "{{ _docker_repo is changed }}"
    allow_downgrade: true

- name: Hold Docker packages at the pinned versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ docker_packages.keys() | list }}"

- name: Daemon config (bounded logs, live-restore, real client IPs on published ports)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: "{{ _daemon | to_nice_json }}\n"
  vars:
    _daemon:
      log-driver: local
      log-opts: {max-size: 10m, max-file: "3"}
      live-restore: true
      userland-proxy: false
      no-new-privileges: true
  notify: Restart docker

- name: Docker running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
