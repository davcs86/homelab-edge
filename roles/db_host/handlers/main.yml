---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart postgresql
  ansible.builtin.systemd_service:
    name: "{{ db_pg_service }}"
    state: restarted

- name: Reload postgresql
  ansible.builtin.systemd_service:
    name: "{{ db_pg_service }}"
    state: reloaded

- name: Restart pgbouncer
  ansible.builtin.systemd_service:
    name: pgbouncer
    state: restarted

- name: Reload pgbouncer
  ansible.builtin.systemd_service:
    name: pgbouncer
    state: reloaded

- name: Restart pgbackrest server
  ansible.builtin.systemd_service:
    name: pgbackrest-server
    state: restarted
