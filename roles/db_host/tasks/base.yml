---
- name: Base packages
  ansible.builtin.apt:
    name: [acl, ca-certificates, curl, gnupg, iproute2, openssh-server, sudo, python3]
    update_cache: true
    cache_valid_time: 3600

- name: Deploy user (automation only, no password)
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    password: "!"
    update_password: always

- name: Authorise the deploy key
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_ssh_public_key }}"
    exclusive: true

- name: Sudo for the deploy user
  ansible.builtin.copy:
    dest: /etc/sudoers.d/20-deploy
    content: "{{ deploy_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# Root may log in with a key only until the deploy user exists; every run as the deploy user closes it.
- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin {{ 'prohibit-password' if ansible_user == 'root' else 'no' }}
      AllowAgentForwarding no
  notify: Restart sshd
