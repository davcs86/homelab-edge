---
- name: Stack directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ edge_root }}", mode: "0750"}
    - {path: "{{ edge_root }}/headscale", mode: "0755"}
    - {path: "{{ edge_root }}/caddy", mode: "0750"}
    - {path: "{{ edge_root }}/caddyfile", mode: "0755"}
    - {path: "{{ edge_root }}/ntfy", mode: "0750"}
    - {path: "{{ edge_root }}/gatus", mode: "0750"}
    - {path: "{{ edge_root }}/webhooks-mcp", mode: "0750"}
    - {path: "{{ edge_root }}/commsgun", mode: "0750"}
    - {path: /var/log/caddy, mode: "0750"}
  loop_control:
    label: "{{ item.path }}"

# ---------- headscale ----------
- name: Headscale config
  ansible.builtin.template:
    src: headscale-config.yaml.j2
    dest: "{{ edge_root }}/headscale/config.yaml"
    mode: "0644"
  notify: Restart headscale

# The "tests" block is CI-only: headscale re-runs it on every reload and would reject updates
# while tagged nodes are still missing (fresh tailnet, node rebuilt, etc.).
- name: Render policy without its tests block
  ansible.builtin.command: python3 {{ playbook_dir }}/../scripts/hujson2json.py {{ playbook_dir }}/../policy/policy.hujson --drop tests
  delegate_to: localhost
  become: false
  register: _policy_json
  changed_when: false
  check_mode: false

- name: Headscale policy
  ansible.builtin.copy:
    dest: "{{ edge_root }}/headscale/policy.hujson"
    content: "{{ _policy_json.stdout }}\n"
    mode: "0644"
  notify: Reload headscale policy

- name: Seed extra DNS records file (filled in once the edge has a tailnet address)
  ansible.builtin.copy:
    dest: "{{ edge_root }}/headscale/extra-records.json"
    content: "[]\n"
    mode: "0644"
    force: false

# ---------- Caddy ----------
- name: Caddy build context
  ansible.builtin.copy:
    src: caddy/Dockerfile
    dest: "{{ edge_root }}/caddy/Dockerfile"
    mode: "0644"

- name: Caddy secrets
  ansible.builtin.copy:
    dest: "{{ edge_root }}/caddy/caddy.env"
    content: "DESEC_TOKEN={{ edge_secrets.desec_token }}\n"
    mode: "0600"
  no_log: true
  notify: Restart caddy

# ---------- ntfy ----------
- name: Ntfy config
  ansible.builtin.template:
    src: ntfy-server.yml.j2
    dest: "{{ edge_root }}/ntfy/server.yml"
    mode: "0640"
  no_log: true
  notify: Restart ntfy

# ---------- Gatus ----------
- name: Gatus config
  ansible.builtin.template:
    src: gatus-config.yaml.j2
    dest: "{{ edge_root }}/gatus/config.yaml"
    mode: "0644"
  notify: Restart gatus

- name: Gatus secrets
  ansible.builtin.copy:
    dest: "{{ edge_root }}/gatus/gatus.env"
    content: |
      NTFY_TOKEN={{ edge_secrets.ntfy_alerts_token }}
      HEARTBEAT_PVE_TOKEN={{ edge_secrets.gatus_heartbeat_pve_token }}
      HEARTBEAT_BACKUP_TOKEN={{ edge_secrets.gatus_heartbeat_backup_token }}
      HEARTBEAT_DB_TOKEN={{ edge_secrets.gatus_heartbeat_db_token }}
      HEARTBEAT_PGBACKREST_TOKEN={{ edge_secrets.gatus_heartbeat_pgbackrest_token }}
    mode: "0600"
  no_log: true
  notify: Restart gatus

# ---------- webhooks-mcp ----------
# Compose recreates the container when this env file's content changes.
- name: Webhooks-mcp secrets
  ansible.builtin.copy:
    dest: "{{ edge_root }}/webhooks-mcp/webhooks-mcp.env"
    content: |
      MCP_AUTH_KEY={{ edge_secrets.webhooks_mcp_auth_key }}
      INGEST_BASE_URLS={{ _ingest_base_urls | to_json }}
    mode: "0600"
  vars:
    _ingest_base_urls:
      default: "https://{{ webhooks_ingest_hostname }}"
      staging: "https://{{ webhooks_ingest_hostname }}:{{ staging_edge_port }}"
  no_log: true

# ---------- commsgun ----------
# fail_msg is printed even under no_log: it may name a key or an app id, never a value.
- name: Commsgun secrets and configuration
  no_log: true
  vars:
    _email_apps: "{{ commsgun_apps | selectattr('channels.email', 'defined') | map(attribute='id') | list }}"
  block:
    - name: Commsgun secrets are present and fit a single-quoted env line
      ansible.builtin.assert:
        that:
          - edge_secrets[item] is defined
          - edge_secrets[item] is string
          - edge_secrets[item] | length > 0
          - "\"'\" not in edge_secrets[item]"
          - "'\\\\' not in edge_secrets[item]"
          - "'\\r' not in edge_secrets[item]"
          - "'\\n' not in edge_secrets[item]"
        fail_msg: "secrets/edge.sops.yaml: {{ item }} is missing, empty, or holds a quote, backslash or line break"
        quiet: true
      loop: >-
        {{ ['resend_api_key', 'commsgun_admin_password', 'commsgun_session_secret', 'commsgun_admin_api_token']
           + commsgun_apps | map(attribute='key') | list }}

    # Minimums are the service's own start-up limits (api MinSecretLen, ui MIN_ADMIN_PASSWORD).
    - name: Commsgun secrets are as long as the service requires
      ansible.builtin.assert:
        that: edge_secrets[item] | length >= (16 if item == 'commsgun_admin_password' else 32)
        fail_msg: "secrets/edge.sops.yaml: {{ item }} is shorter than commsgun accepts (32 characters; 16 for the password)"
        quiet: true
      loop: >-
        {{ ['commsgun_admin_password', 'commsgun_session_secret', 'commsgun_admin_api_token']
           + commsgun_apps | map(attribute='key') | list }}

    - name: Commsgun senders are a map
      ansible.builtin.assert:
        that:
          - edge_secrets.commsgun_senders is defined
          - edge_secrets.commsgun_senders is mapping
        fail_msg: "secrets/edge.sops.yaml: commsgun_senders is missing or not a map of app id to senders"
        quiet: true

    - name: Every email app has senders that include its default
      ansible.builtin.assert:
        that:
          - item.id in edge_secrets.commsgun_senders
          - edge_secrets.commsgun_senders[item.id].senders is defined
          - edge_secrets.commsgun_senders[item.id].senders is sequence
          - edge_secrets.commsgun_senders[item.id].senders is not string
          - edge_secrets.commsgun_senders[item.id].senders is not mapping
          - edge_secrets.commsgun_senders[item.id].senders | length > 0
          - edge_secrets.commsgun_senders[item.id].senders | reject('string') | list | length == 0
          - "'\\r' not in edge_secrets.commsgun_senders[item.id].senders | join('')"
          - "'\\n' not in edge_secrets.commsgun_senders[item.id].senders | join('')"
          - edge_secrets.commsgun_senders[item.id].default_sender is defined
          - edge_secrets.commsgun_senders[item.id].default_sender is string
          - "'\\r' not in edge_secrets.commsgun_senders[item.id].default_sender"
          - "'\\n' not in edge_secrets.commsgun_senders[item.id].default_sender"
          - edge_secrets.commsgun_senders[item.id].default_sender in edge_secrets.commsgun_senders[item.id].senders
          - >-
            ([edge_secrets.commsgun_senders[item.id].default_sender] + edge_secrets.commsgun_senders[item.id].senders)
            | reject('match', '^([^<>@\\s]+@[^<>@\\s]+|.*<[^<>@\\s]+@[^<>@\\s]+>)$') | list | length == 0
        fail_msg: >-
          secrets/edge.sops.yaml: commsgun_senders has no usable entry for app {{ item.id }}
          (a non-empty list of single-line "address" or "Name <address>" senders containing default_sender)
        quiet: true
      loop: "{{ commsgun_apps | selectattr('channels.email', 'defined') | list }}"

    - name: Commsgun senders name only registered email apps
      ansible.builtin.assert:
        that: edge_secrets.commsgun_senders | list | reject('in', _email_apps) | list | length == 0
        fail_msg: >-
          secrets/edge.sops.yaml: commsgun_senders has
          {{ edge_secrets.commsgun_senders | list | reject('in', _email_apps) | list | length }}
          entries whose key is not the id of an app with an email channel in commsgun_apps
        quiet: true

    # Compose takes a single-quoted value verbatim except that \' is an escape: hence no ', \, CR or LF in raw values.
    - name: Commsgun API environment
      ansible.builtin.copy:
        dest: "{{ edge_root }}/commsgun/api.env"
        content: |
          COMMSGUN_CONFIG='{{ lookup('ansible.builtin.template', 'commsgun-config.json.j2') | trim }}'
          RESEND_API_KEY='{{ edge_secrets.resend_api_key }}'
          ADMIN_API_TOKEN='{{ edge_secrets.commsgun_admin_api_token }}'
        mode: "0600"

    - name: Commsgun dashboard environment
      ansible.builtin.copy:
        dest: "{{ edge_root }}/commsgun/ui.env"
        content: |
          ADMIN_PASSWORD='{{ edge_secrets.commsgun_admin_password }}'
          SESSION_SECRET='{{ edge_secrets.commsgun_session_secret }}'
          ADMIN_API_TOKEN='{{ edge_secrets.commsgun_admin_api_token }}'
          API_BASE_URL='http://commsgun-api:9201'
          ORIGIN='https://{{ commsgun_ui_hostname }}'
        mode: "0600"

- name: Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ edge_root }}/compose.yml"
    mode: "0644"

- name: Build the Caddy image (needed to validate the Caddyfile)
  ansible.builtin.command: docker compose -f {{ edge_root }}/compose.yml build caddy
  register: _caddy_build
  changed_when: "'Built' in _caddy_build.stderr or 'naming to' in _caddy_build.stderr"

- name: Staging VM node, as headscale knows it
  ansible.builtin.command: "docker compose -f {{ edge_root }}/compose.yml exec -T headscale headscale nodes list -o json"
  register: _hs_nodes_caddy
  changed_when: false
  failed_when: false

- name: Tailnet addresses of the staging VM
  ansible.builtin.set_fact:
    staging_vm_ips: >-
      {{ (_hs_nodes_caddy.stdout if _hs_nodes_caddy.rc == 0 and _hs_nodes_caddy.stdout | length > 0 else '[]') | from_json
         | selectattr('given_name', 'equalto', staging_tailnet_host.split('.')[0])
         | map(attribute='ip_addresses') | first | default([]) }}

- name: Say why Caddy cannot isolate the staging VM yet
  ansible.builtin.debug:
    msg: >-
      {{ staging_tailnet_host.split('.')[0] }} is not a registered tailnet node (or headscale is not up yet):
      the edge has no staging-VM deny rule until it joins and deploy runs again
  when: staging_vm_ips | length == 0

- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ edge_root }}/caddyfile/Caddyfile"
    mode: "0644"
    validate: >-
      docker run --rm --network none -e DESEC_TOKEN=validate -v %s:/etc/caddy/Caddyfile:ro
      edge-caddy:{{ caddy_version }}-{{ caddy_ratelimit_commit[:12] }} caddy validate --config /etc/caddy/Caddyfile
  notify: Reload caddy

- name: Remove the Caddyfile from its old single-file mount location
  ansible.builtin.file:
    path: "{{ edge_root }}/caddy/Caddyfile"
    state: absent

# ---------- Compose ----------
- name: Start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ edge_root }}"
    build: never
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: 300

- name: Flush handlers so config changes apply before verification
  ansible.builtin.meta: flush_handlers

- name: Does the running Caddy read the Caddyfile on disk?
  ansible.builtin.shell: |
    set -o pipefail
    [ "$(docker compose -f {{ edge_root }}/compose.yml exec -T caddy sha256sum /etc/caddy/Caddyfile | cut -d' ' -f1)" \
      = "$(sha256sum {{ edge_root }}/caddyfile/Caddyfile | cut -d' ' -f1)" ]
  args:
    executable: /bin/bash
  register: _caddy_file
  changed_when: false
  failed_when: false

- name: Restart Caddy that still reads a stale Caddyfile inode
  when: _caddy_file.rc != 0
  block:
    - name: Restart Caddy
      ansible.builtin.command: docker compose -f {{ edge_root }}/compose.yml restart caddy
      changed_when: true

    - name: Caddy now reads the Caddyfile on disk
      ansible.builtin.shell: |
        set -o pipefail
        [ "$(docker compose -f {{ edge_root }}/compose.yml exec -T caddy sha256sum /etc/caddy/Caddyfile | cut -d' ' -f1)" \
          = "$(sha256sum {{ edge_root }}/caddyfile/Caddyfile | cut -d' ' -f1)" ]
      args:
        executable: /bin/bash
      register: _caddy_file_again
      until: _caddy_file_again.rc == 0
      retries: 10
      delay: 3
      changed_when: false

- name: Headscale users
  ansible.builtin.command: docker compose -f {{ edge_root }}/compose.yml exec -T headscale headscale users list -o json
  register: _hs_users
  changed_when: false

- name: Create missing headscale users
  ansible.builtin.command: docker compose -f {{ edge_root }}/compose.yml exec -T headscale headscale users create {{ item }}
  loop: "{{ headscale_users | difference(_hs_users.stdout | from_json | map(attribute='name') | list) }}"
  changed_when: true

- name: Publicly trusted certificates for every site, with ACME diagnostics on failure
  vars:
    # One SNI per certificate Caddy manages; status.* and webhooks.* are served by the *.{{ magicdns_base_domain }} wildcard.
    _cert_check: >-
      {{ playbook_dir }}/../scripts/tls-check.py {{ headscale_hostname }} {{ edge_sites | map(attribute='hostname') | join(' ') }}
      {{ status_hostname }} {{ webhooks_ingest_hostname }}
  block:
    - name: Probe the certificates
      ansible.builtin.script:
        cmd: "{{ _cert_check }}"
        executable: python3
      register: _cert_probe
      changed_when: false
      failed_when: false

    - name: Certificate probe result
      ansible.builtin.debug:
        var: _cert_probe.stdout_lines
      when: _cert_probe.rc != 0

    # A reload keeps ACME retry jobs already in backoff, still on the old TLS settings; a restart drops them.
    # Only done while some site has no certificate, i.e. while that site is already down.
    - name: Restart Caddy to restart issuance
      ansible.builtin.command: docker compose -f {{ edge_root }}/compose.yml restart caddy
      when: _cert_probe.rc != 0
      changed_when: true

    # The retry budget (~15 min) must outlast Caddy's DNS-01 propagation_delay + propagation_timeout.
    - name: Every site presents a publicly trusted certificate
      ansible.builtin.script:
        cmd: "{{ _cert_check }}"
        executable: python3
      register: _certs
      until: _certs.rc == 0
      retries: 80
      delay: 10
      changed_when: false

    - name: Certificates
      ansible.builtin.debug:
        var: _certs.stdout_lines

    # curl, not uri: --resolve pins the connection to this host while still validating the public certificate.
    - name: Headscale answers over HTTPS  # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -fsS --max-time 10 --retry 6 --retry-delay 5 --retry-all-errors
        --resolve {{ headscale_hostname }}:443:127.0.0.1 https://{{ headscale_hostname }}/health
      register: _hs_health
      changed_when: false
  rescue:
    # deSEC accepts the ACME token only from allow-listed source addresses; these are the ones it sees.
    - name: Egress addresses as seen from outside  # noqa: command-instead-of-module
      ansible.builtin.shell: |
        echo "ipv4: $(curl -4 -fsS --max-time 10 https://api.ipify.org || echo none)"
        echo "ipv6: $(curl -6 -fsS --max-time 10 https://api64.ipify.org || echo none)"
      register: _egress
      changed_when: false
      failed_when: false

    # Unfiltered on purpose: two failed deploys printed nothing through a grep, so show what the commands return.
    - name: Caddy TLS/ACME log lines
      ansible.builtin.shell: |
        set -o pipefail
        c="docker compose -f {{ edge_root }}/compose.yml"
        echo "## caddy container"; $c ps --format '{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}.State{{ '}}' }} {{ '{{' }}.Status{{ '}}' }}' caddy 2>&1
        echo "## names in the loaded TLS automation policies"
        curl -fsS --max-time 5 http://localhost:2019/config/apps/tls/automation/policies 2>&1 \
          | python3 -c 'import json,sys; [print(" ", p.get("subjects")) for p in json.load(sys.stdin)]' 2>&1
        echo "## caddy log, last 30 min: $($c logs --no-color --since 30m caddy 2>&1 | wc -l) lines; ACME-related:"
        $c logs --no-color --since 30m caddy 2>&1 | grep -iE 'acme|challenge|desec|certificate|obtain|solv|error' | tail -n 40
        echo "## caddy log, last 25 lines unfiltered"; $c logs --no-color --tail 25 caddy 2>&1
      args:
        executable: /bin/bash
      register: _caddy_acme_log
      changed_when: false
      failed_when: false

    - name: Fail with the evidence
      ansible.builtin.fail:
        msg: "{{ (_certs.stdout_lines | default(_cert_probe.stdout_lines | default(['certificate check did not run'])))
                 + _egress.stdout_lines + _caddy_acme_log.stdout_lines }}"

- name: Show health
  ansible.builtin.debug:
    msg: "{{ _hs_health.stdout }}"
